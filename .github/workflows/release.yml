name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   npm version minor && git push --follow-tags
#
# Authentication uses npm trusted publishing (OIDC) — there is no NPM_TOKEN
# secret in this repo. npm verifies the request came from this workflow in this
# repository and mints a short-lived credential for the publish. Configure the
# trusted publisher once at:
#   https://www.npmjs.com/package/@hipo-finance/sdk/access
# pointing at repository `HipoFinance/sdk` and workflow `release.yml`.
#
# Publishing this way also attaches a signed provenance attestation, so anyone
# can verify which commit and workflow run produced the published tarball:
#   npm audit signatures

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for OIDC: lets the job request the identity token npm exchanges
  # for a publish credential. Without it the publish fails with ENEEDAUTH.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Points the publish at the public registry. No NODE_AUTH_TOKEN is
          # set — that absence is what makes npm fall through to OIDC.
          registry-url: https://registry.npmjs.org
          cache: npm

      # The runner's bundled npm lags behind. Trusted publishing needs >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Guards against tagging v4.3.1 while package.json still says 4.3.0,
      # which would otherwise publish the wrong version under that tag.
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version but package.json says $pkg_version"
            exit 1
          fi
          echo "Publishing version $pkg_version"

      # Build up front so a compile failure is attributed to this step rather
      # than surfacing from inside `npm publish`, which runs it again via the
      # `prepare` hook when it packs the tarball.
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
